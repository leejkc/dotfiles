# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1,1920x1080@120,0x0,1
# monitor = eDP-1,disable

# monitor = HDMI-A-1,1920x1080@165,1920x-800,1,transform,1,mirror,DP-2
monitor = HDMI-A-1,1920x1080@165,-1920x0,1 #left
# monitor = HDMI-A-1,1920x1080@165,0x-1080,1 #above
workspace=name:HDMI-A-1,monitor:HDMI-A-1,persistent:true,default:true

# monitor = DP-1,1920x1080@165,1920x-800,1,transform,1,mirror,DP-2
monitor = DP-1,1920x1080@165,1920x0,1
# monitor = DP-1,1920x1080@165,0x-1080,1 #above
workspace=name:DP-1,monitor:HDMI-A-1,persistent:true,default:true

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = $terminal yazi
$menu = rofi -show drun -show-icons
$windows = rofi -show window
$browser = google-chrome-stable
$ide = code

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = kitty bash -c "neofetch; iwctl station wlan1 disconnect; read"

exec-once = hyprctl setcursor Moga-Candy-Grey 24

exec-once = waybar & hyprpaper & dunst

exec-once = hypridle

exec-once = blueman-applet

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# NVIDIA:
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = AQ_DRM_DEVICES,/dev/dri/card0

# INTEL:
env = LIBVA_DRIVER_NAME,iHD
env = GBM_BACKEND,mesa
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

env = NO_HARDWARE_CURSORS,true
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = OBSIDIAN_USE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = HYPRCURSOR_THEME,Moga-Candy-Grey
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(e5e9f0aa)
    col.inactive_border = rgba(4c566aaa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.8

    dim_inactive = true
    dim_strength = 0.10
    dim_special = 0.1

    shadow {
        enabled = true
        range = 5
        render_power = 1
        color = rgba(1a1a1a88)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = overshoot,0.5,1,0,1.05

	animation = global, 1, 15, default
	animation = border, 1, 8.085, easeOutQuint
	animation = windows, 1, 12, overshoot, popin
	animation = windowsIn, 1, 6.15, overshoot
	animation = windowsOut, 1, 2.235, overshoot
	animation = windowsMove, 1, 9, overshoot
	animation = fadeIn, 1, 2.595, almostLinear
	animation = fadeOut, 1, 2.19, almostLinear
	animation = fade, 1, 4.545, quick
	animation = layers, 1, 5.715, easeOutQuint
	animation = layersIn, 1, 6, easeOutQuint, fade
	animation = layersOut, 1, 2.25, linear, fade
	animation = fadeLayersIn, 1, 2.685, almostLinear
	animation = fadeLayersOut, 1, 2.085, almostLinear
	animation = workspaces, 1, 7.41, almostLinear, fade
	animation = workspacesIn, 1, 4.815, almostLinear, fade
	animation = workspacesOut, 1, 7.41, almostLinear, fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
layerrule = ignore_alpha 0.06, match:namespace waybar
layerrule = blur on, match:namespace waybar

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    accel_profile = flat

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.8
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace
gesture = 3, up, float, float
gesture = 3, down, float, tile
gesture = 4, swipe, move
gesture = 4, pinch, scale: 2, resize

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, K, exec, $terminal
bind = $mainMod, Return, exec, $terminal -e fish
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, nautilus
bind = $mainMod SHIFT, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, $windows
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, W, exec, $browser
bind = $mainMod, X, exec, moonlight-stable
bind = $mainMod, A, exec, steam
bind = $mainMod, S, exec, spotify
bind = $mainMod, D, exec, github-desktop
bind = $mainMod, G, exec, grim -g "$(slurp -d)" - | tee "/home/lee/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" | wl-copy
bind = $mainMod, B, exec, blueman-manager
bind = $mainMod, C, exec, $ide

bind = $mainMod, page_up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && vol=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') && dunstify -a volume -h int:value:$vol -i audio-volume-high -r 1001 "🔊"
bind = $mainMod, page_down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && vol=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') && dunstify -a volume -h int:value:$vol -i audio-volume-low -r 1001 "🔊"
bind = $mainMod, end, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && dunstify -a volume -h int:value:0 -i audio-volume-muted -r 1001 "🔕"

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && vol=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') && dunstify -a volume -h int:value:$vol -i audio-volume-high -r 1001 "🔊"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && vol=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') && dunstify -a volume -h int:value:$vol -i audio-volume-low -r 1001 "🔊"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && dunstify -a volume -h int:value:0 -i audio-volume-muted -r 1001 "🔕"
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && dunstify -a volume -h int:value:0 -i audio-volume-muted -r 1001 "🔕"
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -q -n s 10%+ && hyprctl notify 3 2000 5E81AC "💡 $(brightnessctl g | grep -o '[0-9]*%')"
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -q -n s 10%- && hyprctl notify 3 2000 5E81AC "💡 $(brightnessctl g | grep -o '[0-9]*%')"


bind = , XF86KbdBrightnessUp, exec, brightnessctl -d 'dell::kbd_backlight' s +25% && hyprctl notify 3 2000 88C0D0 "⌨️ $(brightnessctl -d 'kbd_backlight' g | grep -o '[0-9]*%')"
bind = , XF86KbdBrightnessDown, exec, brightnessctl -d 'dell::kbd_backlight' s 25%- && hyprctl notify 3 2000 88C0D0 "⌨️ $(brightnessctl -d 'kbd_backlight' g | grep -o '[0-9]*%')"

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

# xwaylandvideobridge
windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$
windowrule = no_focus on, match:class ^(xwaylandvideobridge)$

workspace=1,monitor:eDP-1,default:true
workspace=2,monitor:eDP-1
workspace=3,monitor:eDP-1
workspace=4,monitor:eDP-1
workspace=5,monitor:eDP-1
workspace=6,monitor:eDP-1
workspace=7,monitor:eDP-1
workspace=8,monitor:eDP-1
workspace=9,monitor:eDP-1
workspace=10,monitor:eDP-1

